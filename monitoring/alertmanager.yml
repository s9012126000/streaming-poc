route:
  receiver: discord
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: discord
    discord_configs:
      # Alertmanager 不展開環境變數 — 直接把你的 Discord webhook 貼在這裡。
      # 跟 Week 5 Bot 用同一個 Discord 伺服器。
      - webhook_url: "https://discord.com/api/webhooks/REPLACE_ME"
