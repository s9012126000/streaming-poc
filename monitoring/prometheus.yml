global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/pipeline.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]   # container-internal port, host maps to 9095

scrape_configs:
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["flink-jobmanager:9249"]

  # taskmanager runs with replicas: 2 → resolve all container IPs via docker DNS
  - job_name: flink-taskmanager
    dns_sd_configs:
      - names: ["flink-taskmanager"]
        type: A
        port: 9249

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
