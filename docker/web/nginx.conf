# ---------------------------------------------------------------------------
# 前端的 nginx 設定。
#
# 兩個職責：
#   1. 提供靜態檔（vite build 的產物）
#   2. 反向代理 /api 與 /stream 到 gateway
#
# 為什麼需要反向代理：
#   compose 時代前端直接打 http://web-gateway:8000——那是因為瀏覽器
#   透過 host 的 port mapping 連得到。K8s 上沒有這回事：
#   瀏覽器在叢集外，解析不到 gateway.streaming.svc.cluster.local。
#
#   讓 nginx（在叢集內）代理，前端就只要打同源的 /api，
#   不用知道 gateway 在哪，也順便避開 CORS。
# ---------------------------------------------------------------------------

server {
    # 用 8080 而不是 80：非特權埠，容器才能以非 root 使用者執行。
    listen 8080;
    server_name _;

    # --- 健康檢查 ---------------------------------------------------------
    # 不做任何下游依賴檢查，只回 200——liveness 只該問「nginx 還活著嗎」。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- SSE（即時報價推播）------------------------------------------------
    #
    # ⚠️ 必須放在 /api/ 前面。nginx 的 prefix 比對取「最長相符」，
    #    所以 /api/stream 會勝過 /api/——但寫在前面比較不容易看錯。
    #
    # 端點是 /api/stream 不是 /stream——gateway/app.py 的路由全在 /api/ 底下，
    # 前端 useStream.js 呼叫的也是 `/api/stream?symbol=...`。
    location /api/stream {
        # ⚠️ proxy_pass 結尾**不能有斜線**。
        #    有斜線  → nginx 會把 location 的前綴換掉：/api/stream → /stream
        #    沒斜線  → 原路徑完整轉發：/api/stream → /api/stream  ✅
        #    後端只認 /api/stream，寫錯會得到 404——而且很難聯想到是斜線的問題。
        proxy_pass http://gateway.streaming.svc.cluster.local:8000;
        proxy_http_version 1.1;

        proxy_buffering off;          # ★ 關鍵：不緩衝，資料立刻往下送
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        # SSE 是長連線，預設 60 秒逾時會讓它每分鐘斷一次
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # --- 其他 API（/api/symbols、/api/klines、/api/health）------------------
    location /api/ {
        # 同樣不能有結尾斜線，理由見上面
        proxy_pass http://gateway.streaming.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 靜態檔 ------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback：找不到檔案就回 index.html，交給前端路由處理
        try_files $uri $uri/ /index.html;
    }

    # 建置產物的檔名有 hash（index-2sEzoYO_.js），可以長期快取
    location ~* \.(js|css|woff2?)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
