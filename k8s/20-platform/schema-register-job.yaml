# ---------------------------------------------------------------------------
# 註冊 Avro schema — 從 compose 的 kafka-init 拆出來的後半段。
#
# 為什麼拆開：那一段依賴 Schema Registry，而 kafka-init 只依賴 Kafka。
# 拆成兩個 Job 之後，失敗時一眼看得出是「topic 建不起來」還是「schema 註冊失敗」。
#
# schema 檔案從 ConfigMap 掛進來（由 k8s/deploy/gcp/10-register-schema.sh 產生），
# 保持 schemas/market_trade.avsc 是唯一真相來源。
#
# 冪等：Schema Registry 對「內容相同」的註冊會回既有 id、不產生新版本。
#       不相容的變更會被擋下（HTTP 409），Job 會失敗——這是刻意的。
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-register
  namespace: streaming
  labels:
    app: schema-register
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app: schema-register
    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-schema-registry
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              # 有上限的重試——無限迴圈會讓 pod 永遠卡在 PodInitializing，
              # 看起來像「還在跑」，實際上是「永遠不會好」。
              # 有限次數 + 明確失敗訊息，問題才會浮出來。
              URL=http://schema-registry.streaming.svc.cluster.local:8081/subjects
              echo "等待 Schema Registry（最多 60 次 × 2 秒）..."
              for i in $(seq 1 60); do
                if curl -sf "$URL" >/dev/null 2>&1; then
                  echo "Schema Registry 已就緒（第 ${i} 次）"; exit 0
                fi
                [ $((i % 10)) -eq 0 ] && echo "  第 ${i} 次仍未就緒"
                sleep 2
              done
              echo "❌ 等待逾時：$URL 連不上"
              echo "   檢查：kubectl get pods -n streaming -l app=schema-registry"
              exit 1
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }

      containers:
        - name: register
          # 用 cp-kafka 是因為它同時有 curl 和 python3，
          # 而且 node 上已經有這個 image（不用再拉一次）
          image: confluentinc/cp-kafka:7.9.0
          env:
            - name: SR
              value: "http://schema-registry.streaming.svc.cluster.local:8081"
            - name: SUBJECT
              value: "market-trades-value"
            - name: AVSC
              value: "/schemas/market_trade.avsc"
          volumeMounts:
            - name: schemas
              mountPath: /schemas
              readOnly: true
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              # 把 .avsc 包成 Schema Registry 要的 {"schema": "<字串>"} 格式。
              # 用 python3 做 JSON 逸出——手動 escape 一定會出錯。
              python3 -c \
                'import json,sys; print(json.dumps({"schema": open(sys.argv[1]).read()}))' \
                "$AVSC" > /tmp/payload.json

              RESP=$(curl -s -w '\n%{http_code}' -X POST "$SR/subjects/$SUBJECT/versions" \
                -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
                -d @/tmp/payload.json)
              CODE=$(tail -1 <<<"$RESP")
              BODY=$(sed '$d' <<<"$RESP")

              if [ "$CODE" != "200" ]; then
                echo "❌ 註冊失敗 (HTTP $CODE): $BODY" >&2
                echo "   409 = 與既有版本不相容；其他碼多半是連線或格式問題" >&2
                exit 1
              fi

              ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$BODY")
              echo "✅ $SUBJECT → schema id $ID"
              echo "   versions: $(curl -s "$SR/subjects/$SUBJECT/versions")"
              echo
              echo "=== 目前所有 subject ==="
              curl -s "$SR/subjects"
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { cpu: 300m, memory: 512Mi }

      volumes:
        - name: schemas
          configMap:
            name: avro-schemas
