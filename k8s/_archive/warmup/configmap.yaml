# ---------------------------------------------------------------------------
# 暖身 #1：ConfigMap —— 非敏感設定。
#
# 對應到 Docker Compose 的 `environment:` 區塊。
# 兩種用法都示範了：
#   1. 當 env 變數注入（envFrom）           → app 讀環境變數
#   2. 當檔案掛進 volume（volumeMounts）    → app 讀設定檔
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: warmup-config
  namespace: streaming
data:
  # 用法 1：env 變數。這些之後會被真正的服務沿用（對照 docker-compose.yml）
  KAFKA_BOOTSTRAP: "broker-0.kafka.streaming.svc.cluster.local:9092"
  TRINO_HOST: "trino.streaming.svc.cluster.local"
  TRINO_PORT: "8080"
  CHART_SYMBOL: "BTCUSDT"
  # 注意這裡的 DNS 格式：<pod>.<service>.<namespace>.svc.cluster.local
  # 這就是 Compose 裡 `broker-1:29092` 在 K8s 的對應寫法。
  # StatefulSet 的 pod 才有穩定的名字（broker-0/1/2），Deployment 沒有——
  # 這是 Week 7 要用 StatefulSet 跑 Kafka 的核心理由。

  # 用法 2：檔案。掛成 /etc/nginx/conf.d/default.conf
  default.conf: |
    server {
      listen 8080;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
      # readiness probe 打這裡：不做任何依賴檢查，只回 200
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warmup-html
  namespace: streaming
data:
  index.html: |
    <!doctype html>
    <meta charset="utf-8">
    <title>streaming-poc / warmup</title>
    <style>
      body{font-family:ui-monospace,monospace;background:#0d1117;color:#c9d1d9;padding:3rem}
      h1{color:#58a6ff} code{background:#161b22;padding:.15em .4em;border-radius:3px}
    </style>
    <h1>✅ Week 6 warm-up</h1>
    <p>如果你看得到這頁，代表以下這條路徑全部通了：</p>
    <ol>
      <li>GKE Spot node 起來了，且 pod 排得進去</li>
      <li>Deployment → ReplicaSet → Pod 三層關係正常</li>
      <li>ConfigMap 兩種用法都生效（這頁的 HTML + nginx 設定檔都來自 ConfigMap）</li>
      <li>Service 的 ClusterIP 有把流量導到 pod</li>
      <li>readiness probe 通過，pod 才進了 Service 的 endpoints</li>
    </ol>
    <p>下一步：<code>kubectl exec</code> 進去確認 Secret 有掛上，
       然後 <code>scripts/gcp/06-down.sh</code> 縮到 0 再擴回來，看它自己長回來。</p>
