version: "3.8"

services:

  # ──────────────────────────────────────────
  # 1. Kafka Broker（KRaft 模式)
  # ──────────────────────────────────────────
  broker:
    image: confluentinc/cp-kafka:7.9.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"       # 外部連線（Producer/Consumer on host）
      - "29092:29092"     # 內部連線（容器間通訊）
    environment:
      # KRaft 角色設定
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093

      # Listener 設定
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://broker:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Topic 設定
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # KRaft 叢集唯一 ID
      CLUSTER_ID: "7YkApeILRgCTCrfxFxEhjw"
    volumes:
      - broker_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ──────────────────────────────────────────
  # 2. Schema Registry
  # ──────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────
  # 3. Kafka Control Center（監控 UI）
  # ──────────────────────────────────────────
  control-center:
    image: confluentinc/cp-enterprise-control-center:7.9.0
    hostname: control-center
    container_name: control-center
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: broker:29092
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

  # ──────────────────────────────────────────
  # 4. MinIO（本地 S3，Iceberg Parquet 儲存）
  # ──────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    hostname: minio
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO bucket 初始化（自動建立 warehouse bucket）
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/warehouse &&
        mc mb --ignore-existing local/warehouse/checkpoints &&
        echo 'MinIO buckets ready.' &&
        exit 0
      "
    restart: "no"

  # ──────────────────────────────────────────
  # 5. Iceberg REST Catalog
  # ──────────────────────────────────────────
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    hostname: iceberg-rest
    container_name: iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  # ──────────────────────────────────────────
  # 6. Apache Flink 2.0 — JobManager
  # ──────────────────────────────────────────
  flink-jobmanager:
    image: apache/flink:2.0-scala_2.12
    hostname: flink-jobmanager
    container_name: flink-jobmanager
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8082:8081"   # Flink Dashboard UI
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m

        # State Backend（RocksDB，存於 MinIO）
        state.backend: rocksdb
        state.backend.rocksdb.memory.managed: true
        state.checkpoints.dir: s3://warehouse/checkpoints
        state.savepoints.dir: s3://warehouse/savepoints

        # MinIO / S3 連線設定
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true

        # Checkpoint 設定（Exactly-Once）
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.max-concurrent-checkpoints: 1
        execution.checkpointing.timeout: 60s

        # Watermark Idle Timeout（解決股市收盤後 Watermark 停止問題）
        table.exec.source.idle-timeout: 30s

        # Metrics（Prometheus 格式）
        metrics.reporter.prometheus.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prometheus.port: 9249

  # ──────────────────────────────────────────
  # 7. Apache Flink 2.0 — TaskManager
  # ──────────────────────────────────────────
  flink-taskmanager:
    image: apache/flink:2.0-scala_2.12
    hostname: flink-taskmanager
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 4

        # State Backend
        state.backend: rocksdb
        state.backend.rocksdb.memory.managed: true
        state.checkpoints.dir: s3://warehouse/checkpoints

        # MinIO / S3 連線設定
        s3.endpoint: http://minio:9000
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.path.style.access: true

# ──────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────
volumes:
  broker_data:
  minio_data: